<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenicakes Hub | Universal Script</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a21;
            --accent: #a855f7;
            --accent-hover: #9333ea;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: #2a323d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 6px;
            font-weight: 800;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .section {
            margin-bottom: 22px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .code-box {
            background: #080b0e;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            word-break: break-all;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .copy-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: var(--accent-hover);
        }

        .game-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }

        .game-item {
            background: #080b0e;
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-discord {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: #5865F2;
            color: #fff;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-discord:hover {
            background: #4752C4;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Jenicakes Hub</h1>
        <p>Universal Roblox Script Hub</p>
    </header>

    <!-- Script Loadstring -->
    <div class="section">
        <div class="section-title">Execution Loader</div>
        <div class="code-box">
            <span id="loadstring">loadstring(game:HttpGet("https://jenicakes.vercel.app/api/loader"))()</span>
            <button class="copy-btn" onclick="copyScript()" id="copyBtn">Copy</button>
        </div>
    </div>

    <!-- Supported Games -->
    <div class="section">
        <div class="section-title">Supported Games</div>
        <ul class="game-list">
            <li class="game-item">🥚 Break a Brainrot Egg</li>
            <li class="game-item">🥚 Steal Anime Eggs</li>
            <li class="game-item">🌱 +1 Cut Grass Adventure</li>
            <li class="game-item">💰 Steal From The Rich</li>
        </ul>
    </div>

    <!-- Discord Link -->
    <div class="section">
        <a href="https://discord.gg/GFZYsspybS" target="_blank" class="btn-discord">
            Join Official Discord
        </a>
    </div>
</div>

<script>
    function copyScript() {
        const text = document.getElementById("loadstring").innerText;
        navigator.clipboard.writeText(text);
        const btn = document.getElementById("copyBtn");
        btn.innerText = "Copied!";
        setTimeout(() => {
            btn.innerText = "Copy";
        }, 2000);
    }
</script>

</body>
</html>
