<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenicakes Hub | Universal Script</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #2a0845 0%, #12002b 100%);
            --card-bg: rgba(35, 10, 55, 0.75);
            --pink-accent: #ff007f;
            --pink-glow: #ff55bb;
            --purple-border: #6a0da8;
            --text-main: #ffffff;
            --text-sub: #d8b4fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #12002b;
            background-image: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--purple-border);
            border-radius: 18px;
            padding: 28px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.25);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2.3rem;
            color: var(--pink-accent);
            text-shadow: 0 0 12px var(--pink-glow);
            margin-bottom: 6px;
            font-weight: 800;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .section {
            margin-bottom: 22px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .code-box {
            background: rgba(15, 0, 30, 0.8);
            border: 1px solid var(--purple-border);
            border-radius: 10px;
            padding: 12px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            word-break: break-all;
            color: #ff99dd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .copy-btn {
            background: var(--pink-accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 10px var(--pink-accent);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #e0006c;
            box-shadow: 0 0 15px var(--pink-glow);
        }

        .game-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }

        .game-item {
            background: rgba(15, 0, 30, 0.7);
            border: 1px solid var(--purple-border);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-discord {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: #5865F2;
            color: #fff;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
            box-shadow: 0 0 12px rgba(88, 101, 242, 0.4);
            transition: background 0.2s;
        }

        .btn-discord:hover {
            background: #4752C4;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Jenicakes Hub</h1>
        <p>Universal Roblox Script Hub</p>
    </header>

    <div class="section">
        <div class="section-title">Execution Loader</div>
        <div class="code-box">
            <span id="loadstring">loadstring(game:HttpGet("https://jenicakes.vercel.app/api/loader"))()</span>
            <button class="copy-btn" onclick="copyScript()" id="copyBtn">Copy</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Supported Games</div>
        <ul class="game-list">
            <li class="game-item">🥚 Break a Brainrot Egg</li>
            <li class="game-item">🥚 Steal Anime Eggs</li>
            <li class="game-item">🌱 +1 Cut Grass Adventure</li>
            <li class="game-item">💰 Steal From The Rich</li>
        </ul>
    </div>

    <div class="section">
        <a href="https://discord.gg/GFZYsspybS" target="_blank" class="btn-discord">
            Join Official Discord
        </a>
    </div>
</div>

<script>
    function copyScript() {
        const text = document.getElementById("loadstring").innerText;
        navigator.clipboard.writeText(text);
        const btn = document.getElementById("copyBtn");
        btn.innerText = "Copied!";
        setTimeout(() => {
            btn.innerText = "Copy";
        }, 2000);
    }
</script>

</body>
</html>
